<script>

put(4,4);put(b.length,8);b.forEach(function(c){put(c,8)});

var per=dcw/nb,blocks=[],ecs=[];
for(i=0;i<nb;i++){var d=data.slice(i*per,(i+1)*per),r=new Array(ecl).fill(0);

for(i=0;i<size;i++){setF(6,i,i%2==0);setF(i,6,i%2==0)}

var g=function(n){return((bt>>n)&1)!=0};
for(k=0;k<=5;k++)setF(8,k,g(k));setF(8,7,g(6));setF(8,8,g(7));setF(7,8,g(8));for(k=9;k<15;k++)setF(14-k,8,g(k));

for(right=size-1;right>=1;right-=2){if(right==6)right=5;
for(vert=0;vert<size;vert++)for(jj=0;jj<2;jj++){var xx=right-jj,up=((right+1)&2)==0,yy=up?size-1-vert:vert;

html:has(#v .ms-bar){background:var(--card)}
body:has(#v .ms-bar){min-height:100vh}

.ms-hero{display:grid;grid-template-columns:1fr 1fr 1.5fr;gap:8px;margin:0 0 20px;padding:18px 16px;border-radius:24px;background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;box-shadow:0 12px 26px rgba(168,40,27,.26);position:relative;overflow:hidden}
.ms-hero::after{content:"";position:absolute;width:130px;height:130px;border-radius:50%;background:rgba(247,220,111,.22);left:-36px;bottom:-70px}
.ms-hero span{position:relative;z-index:1;display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:600;opacity:.95}
.ms-hero b{font-size:21px;font-weight:800;color:var(--yel);white-space:nowrap;line-height:1.2}
.ms-t{margin:0 4px 12px}.ms-t small{font-size:14px;font-weight:700;color:var(--ink)}
.ms-c{border-radius:24px;border:1px solid var(--line);box-shadow:0 8px 22px rgba(120,40,30,.09);margin-bottom:16px}
.ms-c::before{content:"";display:block;height:5px;background:linear-gradient(90deg,var(--yel),var(--red))}
.ms-h{padding:16px 16px 6px;gap:14px}
.ms-h .bz-av{width:56px;height:56px;border-radius:18px;font-size:23px;background:linear-gradient(145deg,var(--red),var(--red2));color:var(--yel);box-shadow:0 8px 16px rgba(168,40,27,.28)}
.ms-h b{font-size:18px;font-weight:800}
.ms-h small{font-size:13px;margin-top:3px}
.ms-st{margin:0;padding:6px 12px;border-radius:99px;background:color-mix(in srgb,var(--ok) 14%,transparent);font-size:12.5px;font-weight:700;flex:none;font-style:normal}
.ms-st.off{background:var(--line)}
.ms-s{display:grid;grid-template-columns:1fr 1fr 1.6fr;gap:8px;margin:10px 16px 4px}
.ms-s span{background:var(--bg);border-radius:16px;padding:12px 6px;text-align:center;font-size:12px;color:var(--mut);font-weight:600}
.ms-s b{display:block;margin:0 0 2px;font-size:17px;font-weight:800;color:var(--ink);white-space:nowrap}
.ms-a{padding:12px 16px 18px;gap:10px}
.ms-a button{min-height:48px;border-radius:15px;font-size:15px}
.ms-p{flex:1.5;background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;box-shadow:0 8px 16px rgba(168,40,27,.26)}
.ms-q{flex:1;background:var(--tc);color:var(--red);border:0}

.ms-hero{grid-template-columns:1fr 1fr 1.35fr;gap:0;padding:18px 6px}
.ms-hero span{align-items:center;text-align:center;gap:6px;opacity:1;padding:0 6px}
.ms-hero span+span{border-inline-start:1px solid rgba(255,255,255,.22)}
.ms-hero .hi{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center;color:var(--yel)}
.ms-hero .hi svg{width:20px;height:20px}
.ms-hero b{font-size:20px;line-height:1.1}
.ms-hero small{font-size:12px;font-weight:600;color:#fff;opacity:.92;white-space:nowrap}

.mg-top{display:flex;align-items:center;gap:12px}
.mg-top .mg-mn{margin-inline-start:auto}
</style>
</body>
</html>
